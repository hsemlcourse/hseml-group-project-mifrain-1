services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: streamlit run src/ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
